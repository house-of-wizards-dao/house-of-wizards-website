packages:
  - .

allowBuilds:
  "@opensea/seaport-js": false
  "@parcel/watcher": true
  bufferutil: true
  esbuild: true
  keccak: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true

minimumReleaseAgeExclude:
  - "@eslint/config-array@0.23.6"
  - "@playwright/test@1.65.1"
  - eslint@10.15.0
  - playwright-core@1.65.1
  - playwright@1.65.1
  - postcss@8.5.33

# Patch releases for dependencies pinned by wallet SDKs.
overrides:
  "abitype@1.0.6": 1.3.0
  "abitype@1.0.8": 1.3.0
  "decode-uri-component@<0.5.1": 0.5.1
  "ws@>=8 <9": 8.23.0
  use-sync-external-store: 1.7.0

# query-string 7 is CommonJS; the patched decoder exposes its function as an ESM default.
patchedDependencies:
  query-string@7.1.3: patches/query-string@7.1.3.patch
