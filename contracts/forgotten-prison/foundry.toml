[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/", "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "@chainlink/contracts/=lib/chainlink/", "solady/=lib/solady/src/"]
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 128
fail_on_revert = true

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"

[fmt]
line_length = 110
