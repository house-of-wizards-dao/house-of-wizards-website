version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      framework:
        patterns: [next, eslint-config-next, react, react-dom, "@types/react*"]
      wallets:
        patterns: [wagmi, viem, "@rainbow-me/*", "@x402/*"]
      compatible-updates:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
